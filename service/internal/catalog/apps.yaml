# The apps the owner can connect. MCP entries are curated by their name in
# the official registry (registry.modelcontextprotocol.io), noted as
# registry:, which is only used to refresh their urls.
# kind: google (the Google account),
# mcp (a remote MCP server at url, or a local one started by command) or
# local (found on this machine by probe). The starter set is for a team
# doing everyday work; anything else is found by searching the registry.
- id: gmail
  name: Gmail
  category: email
  kind: google
  toolset: mail
  mark: G
  tint: rose
  about: Reads and searches your mail; sends and replies after your OK.
- id: google_calendar
  name: Google Calendar
  category: other
  kind: google
  toolset: calendar
  mark: GC
  tint: sky
  about: Reads your calendar; adds events after your OK.
- id: github
  name: GitHub
  category: code
  kind: mcp
  registry: io.github.github/github-mcp-server
  url: https://api.githubcopilot.com/mcp/
  mark: GH
  tint: ink
  about: Issues, pull requests and code in your repositories.
- id: linear
  name: Linear
  category: code
  kind: mcp
  registry: app.linear/linear
  url: https://mcp.linear.app/mcp
  mark: L
  tint: violet
  about: Finds, creates and updates Linear issues and projects.
- id: notion
  name: Notion
  category: docs
  kind: mcp
  registry: com.notion/mcp
  url: https://mcp.notion.com/mcp
  mark: N
  tint: ink
  about: Searches, reads and writes your Notion pages and databases.
- id: atlassian
  name: Jira & Confluence
  category: code
  kind: mcp
  registry: com.atlassian/atlassian-mcp-server
  url: https://mcp.atlassian.com/v2/mcp
  mark: J
  tint: sky
  about: Jira issues and Confluence pages in your Atlassian site.
- id: stripe
  name: Stripe
  category: other
  kind: mcp
  registry: com.stripe/mcp
  url: https://mcp.stripe.com
  mark: St
  tint: violet
  about: Customers, payments and invoices in your Stripe account.
- id: monday
  name: monday.com
  category: other
  kind: mcp
  registry: com.monday/monday.com
  url: https://mcp.monday.com/mcp
  mark: M
  tint: rose
  about: Boards, items and updates in your monday.com account.
- id: todoist
  name: Todoist
  category: other
  kind: mcp
  registry: net.todoist/mcp
  url: https://ai.todoist.net/mcp
  mark: Td
  tint: rose
  about: Your tasks and projects in Todoist.
- id: airtable
  name: Airtable
  category: docs
  kind: mcp
  registry: com.airtable/mcp
  url: https://mcp.airtable.com/mcp
  mark: A
  tint: sun
  about: Reads and updates your Airtable bases.
- id: supabase
  name: Supabase
  category: code
  kind: mcp
  registry: com.supabase/mcp
  url: https://mcp.supabase.com/mcp
  mark: Sb
  tint: mint
  about: Your Supabase projects, databases and logs.
- id: figma
  name: Figma
  category: other
  kind: mcp
  registry: com.figma.mcp/mcp
  url: https://mcp.figma.com/mcp
  mark: F
  tint: violet
  about: Reads your Figma designs and comments.
- id: canva
  name: Canva
  category: other
  kind: mcp
  registry: com.canva.mcp/mcp
  url: https://mcp.canva.com/mcp
  mark: C
  tint: sky
  about: Finds and makes designs in your Canva account.
- id: exa
  name: Exa
  category: other
  kind: mcp
  registry: ai.exa/exa
  url: https://mcp.exa.ai/mcp
  mark: E
  tint: ink
  about: Searches the web and reads pages for research.
- id: context7
  name: Context7
  category: code
  kind: mcp
  registry: io.github.upstash/context7
  url: https://mcp.context7.com/mcp
  mark: C7
  tint: mint
  about: Up-to-date documentation for code libraries.
- id: playwright
  name: Playwright
  category: other
  kind: mcp
  registry: io.github.microsoft/playwright-mcp
  command: [npx, -y, "@playwright/mcp@0.0.85"]
  mark: P
  tint: peach
  about: A browser on this computer that agents can drive.
- id: zapier
  name: Zapier
  category: other
  kind: mcp
  registry: com.zapier/mcp
  url: https://mcp.zapier.com/api/v1/connect
  mark: Z
  tint: peach
  about: Thousands of apps, Slack included, through one connection.
- id: imessage
  name: iMessage
  category: messaging
  kind: local
  probe: darwin
  access: ~/Library/Messages/chat.db
  steps:
    - Grant Full Disk Access to heyrobotsd in System Settings → Privacy & Security, then connect again.
  mark: iM
  tint: mint
  about: Your Messages on this Mac.
- id: apple_calendar
  name: Apple Calendar
  category: other
  kind: local
  probe: darwin
  access: ~/Library/Calendars
  steps:
    - Allow heyrobotsd to use your calendars in System Settings → Privacy & Security → Calendars (Full Access), then connect again.
  mark: AC
  tint: rose
  about: The calendars on this Mac.
- id: claude_code
  name: Claude Code
  category: code
  kind: local
  probe: claude_code
  mark: CC
  tint: peach
  about: Claude Code on this machine.
